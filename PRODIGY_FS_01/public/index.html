<!DOCTYPE html>
<html>
<head><title>Auth System</title></head>
<body>
    <h2>Register</h2>
    <input id="regUser" placeholder="Username"><br>
    <input id="regEmail" placeholder="Email"><br>
    <input id="regPass" type="password" placeholder="Password"><br>
    <button onclick="register()">Register</button>

    <h2>Login</h2>
    <input id="loginUser" placeholder="Username"><br>
    <input id="loginPass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>

    <button onclick="getProfile()">Get Profile</button>
    <button onclick="getAdmin()">Admin Area</button>
    <div id="output"></div>

    <script>
        let token = '';
        async function register() {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: regUser.value, email: regEmail.value, password: regPass.value})
            });
            output.innerText = await res.text();
        }
        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: loginUser.value, password: loginPass.value})
            });
            const data = await res.json();
            if (data.token) { token = data.token; output.innerText = 'Login success'; }
            else output.innerText = data.error;
        }
        async function getProfile() {
            const res = await fetch('/api/profile', { headers: { 'Authorization': `Bearer ${token}` } });
            output.innerText = await res.text();
        }
        async function getAdmin() {
            const res = await fetch('/api/admin', { headers: { 'Authorization': `Bearer ${token}` } });
            output.innerText = await res.text();
        }
    </script>
</body>
</html>
