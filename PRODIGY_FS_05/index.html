<!DOCTYPE html>
<html>
<head>
    <title>Social Media App</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .post { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
        .post img { max-width: 200px; }
        button { margin: 5px; }
    </style>
</head>
<body>
    <div id="auth">
        <h2>Login / Register</h2>
        <input id="username" placeholder="Username"><br>
        <input id="email" placeholder="Email (for register)"><br>
        <input id="password" type="password" placeholder="Password"><br>
        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>
        <span id="msg"></span>
    </div>
    <div id="app" style="display:none;">
        <h3>Welcome, <span id="currentUser"></span></h3>
        <div>
            <h4>New Post</h4>
            <textarea id="postContent" rows="2" cols="40" placeholder="What's on your mind?"></textarea><br>
            <input type="file" id="postMedia"><br>
            <button onclick="createPost()">Post</button>
        </div>
        <div>
            <h4>Search Users</h4>
            <input id="searchUser" placeholder="Username">
            <button onclick="searchUsers()">Search</button>
            <div id="searchResults"></div>
        </div>
        <div id="feed"></div>
    </div>
    <script>
        let token, currentUserId;
        async function register() {
            const res = await fetch('/api/register', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({username: username.value, email: email.value, password: password.value})
            });
            const data = await res.json();
            msg.innerText = data.message || data.error;
        }
        async function login() {
            const res = await fetch('/api/login', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({username: username.value, password: password.value})
            });
            const data = await res.json();
            if (data.token) {
                token = data.token;
                currentUserId = data.user.id;
                document.getElementById('currentUser').innerText = data.user.username;
                document.getElementById('auth').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadFeed();
            } else {
                msg.innerText = data.error;
            }
        }
        async function createPost() {
            const formData = new FormData();
            formData.append('content', postContent.value);
            const file = document.getElementById('postMedia').files[0];
            if (file) formData.append('media', file);
            const res = await fetch('/api/posts', {
                method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
            });
            const data = await res.json();
            alert(data.message || data.error);
            loadFeed();
        }
        async function loadFeed() {
            const res = await fetch('/api/feed', { headers: { 'Authorization': `Bearer ${token}` } });
            const posts = await res.json();
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '';
            for (let p of posts) {
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `
                    <strong>${p.username}</strong> <small>${new Date(p.created_at).toLocaleString()}</small><br>
                    <p>${p.content}</p>
                    ${p.media_url ? `<img src="${p.media_url}"><br>` : ''}
                    <button onclick="likePost(${p.id})">❤️ ${p.like_count} Likes</button>
                    <button onclick="showComments(${p.id})">💬 Comments (${p.comment_count})</button>
                    <div id="comments-${p.id}"></div>
                `;
                feedDiv.appendChild(postDiv);
            }
        }
        async function likePost(postId) {
            const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            loadFeed();
        }
        async function showComments(postId) {
            const res = await fetch(`/api/posts/${postId}/comments`);
            const comments = await res.json();
            const div = document.getElementById(`comments-${postId}`);
            div.innerHTML = comments.map(c => `<div><b>${c.username}</b>: ${c.comment}</div>`).join('');
            const input = document.createElement('input');
            input.placeholder = 'Add a comment...';
            const btn = document.createElement('button');
            btn.innerText = 'Post';
            btn.onclick = async () => {
                await fetch(`/api/posts/${postId}/comments`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ comment: input.value })
                });
                showComments(postId);
            };
            div.appendChild(input);
            div.appendChild(btn);
        }
        async function searchUsers() {
            const q = document.getElementById('searchUser').value;
            const res = await fetch(`/api/users/search?q=${q}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const users = await res.json();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = users.map(u => `<div>${u.username} <button onclick="followUser(${u.id})">Follow</button></div>`).join('');
        }
        async function followUser(userId) {
            await fetch(`/api/users/${userId}/follow`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            alert('Done');
        }
    </script>
</body>
</html>
